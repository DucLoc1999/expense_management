[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "expense-bot"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "python-telegram-bot==21.6",
    "aiosqlite==0.20.0",
    "gspread==6.1.2",
    "google-auth==2.35.0",
    "httpx==0.27.2",
    "python-dotenv==1.0.1",
]
